 if(over||won){g.fillStyle='rgba(10,5,25,.82)';g.fillRect(0,0,360,640);g.fillStyle='#e9ffd0';g.font='bold 30px Georgia,serif';g.fillText(won?`Level ${lvl} clear`:msg,180,270);g.font='16px Georgia,serif';g.fillText(won?`+${earned} to your stash`:score?`Unbanked ${score} lost`:'Nothing banked',180,310);g.fillStyle='#b9a6e0';g.fillText(won?'Tap for next level':'Tap to retry',180,350)}
}
const hit=(x,y,a,b,w,h)=>x>=a&&x<=a+w&&y>=b&&y<=b+h;
const btn=(x,y,w,h,txt,col)=>{g.fillStyle=col;g.beginPath();g.roundRect(x,y,w,h,h/2);g.fill();g.fillStyle='#10321f';g.font='bold 20px Georgia,serif';g.textAlign='center';g.textBaseline='middle';g.fillText(txt,x+w/2,y+h/2+1)};
let parts=[];
function fxCol(){const k=eq.fx;if(k===4)return`hsl(${Math.random()*360|0},90%,65%)`;const a=FXC[k];return a[Math.random()*a.length|0]}
function trail(a){if(!eq.fx)return;parts.push({x:a.x+(Math.random()-.5)*R(a.t),y:a.y+R(a.t)*.7,vx:(Math.random()-.5)*.6,vy:Math.random()*.8+.2,l:1,s:3+Math.random()*3,c:fxCol(),k:eq.fx})}
function burst(x,y){if(!eq.fx)return;for(let i=0;i<16;i++){const an=i/16*6.283,sp=1.5+Math.random()*2;parts.push({x,y,vx:Math.cos(an)*sp,vy:Math.sin(an)*sp,l:1,s:3+Math.random()*3,c:fxCol(),k:eq.fx})}}
function menuTap(x,y){
 if(scene==='title'){if(hit(x,y,80,400,200,52))scene='play';else if(hit(x,y,80,470,200,52))scene='shop';return}
 if(hit(x,y,110,580,140,40)){scene='title';return}
 ['bg','top','skin','fx'].forEach((k,i)=>{if(hit(x,y,12+i*84,110,80,36))tab=k});
 const list=LISTS[tab];
 for(let i=0;i<list.length;i++)if(hit(x,y,20,160+i*72,320,64)){const o=own[tab];
  if(o.includes(i))eq[tab]=i;else if(stash>=list[i][1]){stash-=list[i][1];o.push(i);eq[tab]=i}
  save()}
}
function drawMenu(){tt++;const bc=BGS[eq.bg],bg=g.createLinearGradient(0,0,0,640);bg.addColorStop(0,bc[2]);bg.addColorStop(1,bc[3]);g.fillStyle=bg;g.fillRect(0,0,360,640);
 g.fillStyle='rgba(120,255,160,.07)';for(let i=0;i<5;i++){g.beginPath();g.arc(40+i*75,80+((i*37)%50),60,0,7);g.fill()}
 g.textAlign='center';g.textBaseline='middle';
 if(scene==='title'){
  const ring=(back)=>{for(let i=0;i<8;i++){const a=tt/90+i*.785,sn=Math.sin(a);if((sn<0)===back)drawObj(180+Math.cos(a)*135,300+sn*55,i,19+sn*4)}};
  g.fillStyle='#e9ffd0';g.font='bold 46px Georgia,serif';g.fillText('Pipe Merge',180,110);g.font='15px Georgia,serif';g.fillStyle='#cdbbf0';g.fillText('slide, stick, merge your gear',180,150);
  ring(true);drawObj(180,290,5,62);ring(false);
  btn(80,400,200,52,'Play','#7ee05a');btn(80,470,200,52,'Shop','#c4a3ff');
  g.fillStyle='#e9ffd0';g.font='14px Georgia,serif';g.fillText(`Level ${lvl}    Stash ${stash}`,180,560);return}
 g.fillStyle='#e9ffd0';g.font='bold 30px Georgia,serif';g.fillText('Shop',180,38);g.font='15px Georgia,serif';g.fillStyle='#ffd23f';g.fillText(`Stash ${stash}`,180,72);
 [['bg','Backdrops'],['top','Tables'],['skin','Skins'],['fx','Trails']].forEach(([k,n],i)=>{const x=12+i*84;g.fillStyle=tab===k?'#7ee05a':'rgba(255,255,255,.12)';g.beginPath();g.roundRect(x,110,80,36,18);g.fill();g.fillStyle=tab===k?'#10321f':'#e9ffd0';g.font='bold 13px Georgia,serif';g.fillText(n,x+40,128)});
 const list=LISTS[tab];
 list.forEach((it,i)=>{const y=160+i*72,ow=own[tab].includes(i),on=eq[tab]===i;
  g.fillStyle='rgba(0,0,0,.35)';g.beginPath();g.roundRect(20,y,320,64,12);g.fill();if(on){g.strokeStyle='#7ee05a';g.lineWidth=2;g.stroke()}
  if(tab==='bg'||tab==='top'){const sw=g.createLinearGradient(0,y+8,0,y+56);sw.addColorStop(0,it[2]);sw.addColorStop(1,it[3]);
  g.fillStyle=sw;g.beginPath();g.roundRect(30,y+8,64,48,8);g.fill();if(tab==='top'){g.strokeStyle=it[4];g.lineWidth=4;g.stroke()}}
  else{g.fillStyle='rgba(255,255,255,.12)';g.beginPath();g.roundRect(30,y+8,64,48,8);g.fill();
   if(tab==='skin'){const pv=eq.skin;eq.skin=i;drawObj(62,y+34,5,20);eq.skin=pv}
   else for(let d=0;d<5;d++){g.fillStyle=i===0?'rgba(255,255,255,.5)':i===4?`hsl(${d*70},90%,65%)`:FXC[i][d%FXC[i].length];g.beginPath();g.arc(40+d*11,y+32,i===0?3:4,0,7);g.fill()}}
  g.textAlign='left';g.fillStyle='#e9ffd0';g.font='bold 17px Georgia,serif';g.fillText(it[0],108,y+22);
  g.font='14px Georgia,serif';g.fillStyle=on?'#7ee05a':ow?'#b9a6e0':stash>=it[1]?'#ffd23f':'#8a7aa8';g.fillText(on?'Equipped':ow?'Tap to equip':`${it[1]} stash`,108,y+44);g.textAlign='center'});
 btn(110,580,140,40,'Back','#7ee05a')
}
function loop(){if(scene==='play'&&!over&&!won){step();step()}draw();requestAnimationFrame(loop)}
loop();
